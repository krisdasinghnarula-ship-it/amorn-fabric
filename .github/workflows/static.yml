# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Remove stale Pages deployment records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEPLOYMENT_IDS=$(gh api \
            "/repos/${{ github.repository }}/deployments?environment=github-pages&per_page=100" \
            --jq '.[] | select(.sha != "${{ github.sha }}") | .id')

          for ID in $DEPLOYMENT_IDS; do
            echo "Marking stale deployment $ID inactive"
            gh api --method POST "/repos/${{ github.repository }}/deployments/$ID/statuses" \
              -f state='inactive' \
              -f description='Superseded by newer Pages deployment' \
              || true
          done

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
